# Test configuration. The real API key is never needed for the tests, so a dummy
# placeholder is used here instead of reading OPENAI_API_KEY from the
# environment. This keeps the test run self-contained.
spring.ai.openai.api-key=test-placeholder-key

# Mirror the main configuration so tests see the same JSON behaviour.
spring.jackson.deserialization.fail-on-null-for-primitives=false
