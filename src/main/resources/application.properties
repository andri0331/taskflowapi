spring.application.name=taskflowapi
# # Enables the H2 console, which is a UI for the H2 database.
#spring.h2.console.enabled=true
# # The URL path to the H2 console.
#spring.h2.console.path=/h2
# # The JDBC URL for the H2 database.
#spring.datasource.url=jdbc:h2:mem:taskflowapi
# A task posted without "completed" should default to false instead of being
# rejected: the field is a primitive, and Jackson 3 fails on a missing value by
# default (FAIL_ON_NULL_FOR_PRIMITIVES).
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ---------------------------------------------------------------------------
# Spring AI - OpenAI / OpenRouter configuration
# ---------------------------------------------------------------------------
# The API key is NOT stored in this file. It is read from the OPENAI_API_KEY
# environment variable when the app starts, so this file is safe to push to
# GitHub - it holds only the variable name, never the key itself.
#
# Set the key in your shell profile (for example ~/.bashrc):
#     export OPENAI_API_KEY=your-key-here
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.model=nvidia/nemotron-3-ultra-550b-a55b:free
spring.ai.openai.embedding.model=nvidia/llama-nemotron-embed-vl-1b-v2:free
spring.ai.openai.embedding.encoding-format=float

# Other models that worked with this key, if you want to try one:
#spring.ai.openai.chat.model=poolside/laguna-xs-2.1:free
